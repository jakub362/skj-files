# Builds and publishes a release. Triggered by a tag, never by an ordinary commit:
#
#     git tag v0.5.0 && git push origin v0.5.0
#
# The tag must match `version` in Cargo.toml - the first job refuses otherwise, so a release can
# never ship an installer that reports a different number than its tag.
#
# Nothing here names the repository: ${{ github.repository }} follows it if the project moves.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          tag_version="${tag#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag_version  Cargo.toml=$cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $tag says $tag_version but Cargo.toml says $cargo_version. Bump Cargo.toml, or retag."
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Installer
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/skj-files.exe "dist/SKJ-Files-${{ needs.check-version.outputs.version }}-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe

  linux:
    name: Linux and Flatpak
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev \
            flatpak flatpak-builder
      - name: Build
        run: cargo build --release --locked

      - name: Plain binary
        run: |
          mkdir -p dist
          cp target/release/skj-files "dist/SKJ-Files-${{ needs.check-version.outputs.version }}-linux-x64"

      - name: Flatpak runtime
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --repo=flatpak-repo \
            flatpak-build packaging/flatpak/org.skjtech.SKJFiles.yml
          flatpak build-bundle flatpak-repo \
            "dist/SKJ-Files-${{ needs.check-version.outputs.version }}-linux-x86_64.flatpak" \
            org.skjtech.SKJFiles

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/SKJ-Files-*-linux-x64
            dist/*.flatpak

  macos:
    name: macOS
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Universal .app, zip and .dmg
        run: DMG=1 bash scripts/package-macos.sh

      - name: Check it really is universal
        run: |
          f="dist/macos/SKJ Files.app/Contents/MacOS/skj-files"
          lipo -archs "$f"
          lipo -archs "$f" | grep -q arm64
          lipo -archs "$f" | grep -q x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.dmg

  publish:
    name: Publish the release
    needs: [check-version, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Source zip
        run: |
          v="${{ needs.check-version.outputs.version }}"
          mkdir -p out
          git archive --format=zip --prefix="skj-files-$v/" -o "out/skj-files-$v-source.zip" HEAD
          find artifacts -type f -exec cp {} out/ \;
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: SKJ Files ${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: out/*
          body: |
            ## SKJ Files ${{ needs.check-version.outputs.version }}

            | Platform | File |
            |---|---|
            | Windows installer | `SKJ-Files-${{ needs.check-version.outputs.version }}-windows-x64-setup.exe` |
            | Windows portable | `SKJ-Files-${{ needs.check-version.outputs.version }}-windows-x64.exe` |
            | Linux Flatpak | `SKJ-Files-${{ needs.check-version.outputs.version }}-linux-x86_64.flatpak` |
            | Linux binary | `SKJ-Files-${{ needs.check-version.outputs.version }}-linux-x64` |
            | macOS | `SKJ-Files-${{ needs.check-version.outputs.version }}-macos-universal.dmg` |

            The builds are not code signed yet, so the first run needs a click past the warning:
            Windows shows SmartScreen (More info -> Run anyway), and macOS needs
            `xattr -cr "/Applications/SKJ Files.app"` or Privacy & Security -> Open Anyway.
