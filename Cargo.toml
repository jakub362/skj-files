[package]
name = "skj-files"
version = "1.0.0"
edition = "2021"
description = "SKJ Files - a fast, good-looking file manager for Windows, Linux and macOS"
authors = ["SKJ Tech"]
license = "GPL-3.0-only"
# THE place the project lives. Moving the repo (e.g. to the SKJ-Technology org) means changing
# this line and the git remote - nothing else. The update check derives the GitHub API URL from
# it, the installer takes its URLs from it, and CI uses ${{ github.repository }} by itself.
repository = "https://github.com/jakub362/skj-files"
build = "build.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "unstable-winit-030"] }
dirs = "7"
trash = "5"
open = "5"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
arboard = { version = "3", default-features = false }
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
blake3 = "1"
crc32fast = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4"
flate2 = "1"
sys-locale = "0.3"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_Graphics_Dwm"] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Local fix: avoid a divide-by-zero when a monitor reports a 0 Hz refresh rate.
[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
